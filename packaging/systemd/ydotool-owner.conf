[Service]
# Socket perm 0666 so any local user can drive ydotoold without requiring
# us to know which UID installed the package. On a single-user desktop this
# is equivalent to the existing key-input trust boundary (anyone with a
# terminal on your machine can already type at your keyboard).
ExecStart=
ExecStart=/usr/bin/ydotoold --socket-perm=0666
# ydotoold 0.1.x (Debian/Ubuntu) has no --socket-perm and leaves the socket
# root-only 0600, so `ydotool key` from the user falls back to opening
# /dev/uinput itself and aborts. chmod it once it appears; a no-op on 1.x.
# Leading `-`: never fail the service over this.
ExecStartPost=-/bin/sh -c 'for i in $(seq 50); do [ -S /tmp/.ydotool_socket ] && exec chmod 0666 /tmp/.ydotool_socket; sleep 0.1; done; exit 1'
